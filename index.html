    <meta charset="UTF-8" />
    <!-- Batch N3 (Onn 2026-07-15 iPad walk): interactive-widget=resizes-content
         tells iOS Safari 15.4+ to SHRINK the layout viewport when the on-screen
         keyboard opens instead of overlapping content. Without it, iOS's own
         auto-scroll-focused-input-into-view logic sees the layout viewport is
         still full-height while the visible viewport shrank, and jumps the
         page all the way to the bottom trying to place the focused input at
         the middle of the LAYOUT viewport. That's Onn's "type customer name
         → page scrolls to bottom" bug. Ignored by older iOS (no regression).
         Same on Chrome mobile Android. Desktop unaffected (no on-screen kb). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
